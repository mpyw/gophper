codecov:
  require_ci_to_pass: true
  # One upload for each OS: the status waits for all of them, as code for
  # one OS is reached only there.
  notify:
    after_n_builds: 3

coverage:
  precision: 1
  round: down
  status:
    # The whole may not get worse, by any amount.
    project:
      default:
        target: auto
        threshold: 0%
    # New and changed lines must be tested.
    patch:
      default:
        target: 90%

comment:
  require_changes: true

# Run by go generate, not by gophper. TestLicensesModules checks its output.
ignore:
  - cmd/gophper/internal/genlicenses
