# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gophper

before:
  hooks:
    - go mod tidy

builds:
  # PHP runs on wazero, so no cgo: every platform cross-compiles.
  - id: gophper
    main: ./cmd/gophper
    binary: gophper
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # gophper --version reports the release, not the go install version.
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mpyw
    name: gophper
  draft: false
