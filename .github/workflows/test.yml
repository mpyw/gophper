name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # id-token: write lets the Codecov upload authenticate as this run,
    # with no stored token. A job's permissions replace the workflow's, so
    # contents: read is restated.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@v4

      # wazero's compiled PHP binaries: 12 s on a fast machine from an empty
      # cache, and far longer on a runner. The CLI tests' own cache, and the
      # user cache directory the rest use, on each OS. go.sum names the
      # wazero and gophper-wasm versions, which make the compiled code.
      - uses: actions/cache@v6
        with:
          # bin holds PHP_BINARY's scripts and php.exe copies, made anew
          # for each run's own gophper. An exclusion removes only what the
          # globs list, so the directory's children are listed, not itself.
          path: |
            ${{ runner.temp }}/gophper-test-cache/*
            !${{ runner.temp }}/gophper-test-cache/bin
            ~/.cache/gophper
            ~/Library/Caches/gophper
            ~/AppData/Local/gophper
          key: gophper-compiled-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}

      - name: Vet
        run: go vet ./...

      # cmd/gophper's tests run the built binary, which go test does not
      # count. coverage.sh builds it with -cover and merges both profiles.
      # Every OS runs it: each has code of its own, which only it can reach.
      - name: Test with coverage
        shell: bash
        run: ./coverage.sh
        env:
          GOPHPER_TEST_CACHE_DIR: ${{ runner.temp }}/gophper-test-cache

      # Codecov merges the three uploads of a commit. The flag tells them
      # apart. Codecov being unreachable is no reason to fail the run.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-merged.txt
          flags: ${{ runner.os }}
          use_oidc: true
        continue-on-error: true

      # Their results do not depend on the OS.
      - name: Lint
        if: matrix.os == 'ubuntu-24.04'
        run: golangci-lint run ./...

      # Files for Windows only, such as its file locks and DNS servers.
      - name: Lint for Windows
        if: matrix.os == 'ubuntu-24.04'
        run: golangci-lint run ./...
        env:
          GOOS: windows

      - name: declscope
        if: matrix.os == 'ubuntu-24.04'
        run: declscope ./... && declscope shrink ./...
