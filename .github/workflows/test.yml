name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # id-token: write lets the Codecov upload authenticate as this run,
    # with no stored token. A job's permissions replace the workflow's, so
    # contents: read is restated.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@v4

      - name: Vet
        run: go vet ./...

      - name: Test
        if: matrix.os != 'ubuntu-24.04'
        run: go test ./...

      # cmd/gophper's tests run the built binary, which go test does not
      # count. coverage.sh builds it with -cover and merges both profiles.
      - name: Test with coverage
        if: matrix.os == 'ubuntu-24.04'
        run: ./coverage.sh

      # Codecov being unreachable is no reason to fail the run.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-merged.txt
          use_oidc: true
        continue-on-error: true

      # Their results do not depend on the OS.
      - name: Lint
        if: matrix.os == 'ubuntu-24.04'
        run: golangci-lint run ./...

      - name: declscope
        if: matrix.os == 'ubuntu-24.04'
        run: declscope ./... && declscope shrink ./...
