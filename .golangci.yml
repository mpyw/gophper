version: "2"

# depguard keeps each package to the layer it belongs to. Every rule is an
# allow list (strict): an import outside it is reported. Rules whose files
# match all apply, so a file must pass each of them.
linters:
  default: standard
  enable:
    - depguard
  settings:
    # Every error is checked, or dropped with _ = and a reason. None of the
    # default exclusions, such as Close and fmt.Fprint*, apply.
    errcheck:
      check-type-assertions: true
      disable-default-exclusions: true
    depguard:
      rules:
        everywhere:
          files:
            - $all
          deny:
            - pkg: C
              desc: gophper is pure Go; cgo would bring back a C toolchain
            - pkg: unsafe
              desc: raw memory belongs to wazero; use api.Memory
            - pkg: io/ioutil
              desc: deprecated; use io and os

        # The library does not log by itself. It returns errors, or writes
        # to an io.Writer its caller passes.
        library-does-not-log:
          files:
            - $all
            - "!**/cmd/**"
          deny:
            - pkg: log
              desc: return the error, or write to a caller's io.Writer
            - pkg: log/slog
              desc: return the error, or write to a caller's io.Writer

        # Package gophper: the Engine. It knows nothing of HTTP or the CLI.
        core:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!**/cmd/**"
            - "!**/internal/**"
            - "!**/server/**"
            - "!**/testdata/**"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/mpyw/gophper-wasm$
            - github.com/mpyw/gophper/internal/dylink$
            - github.com/mpyw/gophper/internal/hostnet$
            - github.com/mpyw/gophper/internal/hostproc$
            - github.com/mpyw/gophper/internal/hostsys$
            - github.com/mpyw/gophper/internal/hostfn$
            - github.com/mpyw/gophper/internal/wasi$
            - github.com/mpyw/gophper/internal/hostsig$
            - github.com/mpyw/gophper/internal/hostvm$
            - github.com/mpyw/gophper/internal/hostpath$

        # Package server: HTTP and FastCGI on top of the Engine's public API.
        server:
          list-mode: strict
          files:
            - "**/server/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/mpyw/gophper$
            - github.com/mpyw/gophper/internal/fcgi$
            - github.com/mpyw/gophper/internal/hostpath$

        # The command wires the public packages together.
        cmd:
          list-mode: strict
          files:
            - "**/cmd/gophper/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/urfave/cli/v3
            - golang.org/x/crypto/acme/autocert$
            - github.com/mpyw/gophper$
            - github.com/mpyw/gophper/server$
            - github.com/mpyw/gophper-wasm$
            - github.com/mpyw/gophper-wasm/ext$

        # The FastCGI protocol stands alone.
        fcgi:
          list-mode: strict
          files:
            - "**/internal/fcgi/*.go"
          allow:
            - $gostd

        # Host paths as PHP sees them.
        hostpath:
          list-mode: strict
          files:
            - "**/internal/hostpath/*.go"
          allow:
            - $gostd

        # The errno values and the Run every host package shares.
        wasi:
          list-mode: strict
          files:
            - "**/internal/wasi/*.go"
          allow:
            - $gostd

        # The VM of one instance: linear memory, interrupts and the timer.
        hostvm:
          list-mode: strict
          files:
            - "**/internal/hostvm/*.go"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero

        # Signals for the guest.
        hostsig:
          list-mode: strict
          files:
            - "**/internal/hostsig/*.go"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/mpyw/gophper/internal/wasi$

        # Sockets and DNS for the guest: the standard library and wazero only.
        hostnet:
          list-mode: strict
          files:
            - "**/internal/hostnet/*.go"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/mpyw/gophper/internal/wasi$
            - github.com/mpyw/gophper/internal/hostpath$
            - golang.org/x/sys/windows$

        # Child processes for the guest. Pipes and sockets come from hostnet.
        hostproc:
          list-mode: strict
          files:
            - "**/internal/hostproc/*.go"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/mpyw/gophper/internal/hostnet$
            - github.com/mpyw/gophper/internal/wasi$
            - github.com/mpyw/gophper/internal/hostpath$

        # PHP functions written in Go.
        hostfn:
          list-mode: strict
          files:
            - "**/internal/hostfn/*.go"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero

        # Users, file locks and the host name for the guest.
        hostsys:
          list-mode: strict
          files:
            - "**/internal/hostsys/*.go"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/mpyw/gophper/internal/wasi$
            - github.com/mpyw/gophper/internal/hostpath$
            - golang.org/x/sys/windows$

        dylink:
          list-mode: strict
          files:
            - "**/internal/dylink/*.go"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/mpyw/gophper/internal/dylink/wasmbin$

        # The wasm binary format needs only wazero's value types.
        wasmbin:
          list-mode: strict
          files:
            - "**/internal/dylink/wasmbin/*.go"
          allow:
            - $gostd
            - github.com/tetratelabs/wazero/api$

        # Tests use the public API, as users would.
        tests:
          list-mode: strict
          files:
            - $test
          allow:
            - $gostd
            - github.com/tetratelabs/wazero
            - github.com/mpyw/gophper$
            - github.com/mpyw/gophper/internal/fcgi$
            - github.com/mpyw/gophper/server$
            - github.com/mpyw/gophper/internal/wasi$
            - github.com/mpyw/gophper-wasm/ext$
            # The adapter structs that a test of the DNS servers on Windows fills.
            - golang.org/x/sys/windows$
